[project]
name = "Rebalance-Pack"
description = "Merged ComfyUI custom node pack combining OmniNode (a sole node that lets you paste in the body of a node class, rebuilding its own inputs/outputs to mirror from the source), the Rebalance resize and mask toolkits (ImageResolutionCap, ImageAspectRatioCrop, MaskAspectRatioBBox, UncropImage, UncropMask, BorderMaskDetector), and the Conditioning-Rebalance nodes (RebalanceGuider, StepRebalance, RebalanceCFG, ConditioningMerge variants, Krea 2 and Ideogram 4 rebalance/encode/edit nodes)."
version = "2.0.0"
license = { file = "LICENSE.txt" }


[project.urls]
Repository = "https://github.com/nova452/OmniNode"
Documentation = "https://github.com/nova452/OmniNode/wiki"
"Bug Tracker" = "https://github.com/nova452/OmniNode/issues"

